<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lese-Timer &amp; Lesetagebuch</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Nunito', system-ui, -apple-system, sans-serif;
  background: linear-gradient(135deg, #2b1f3d, #493361);
  color: #fff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.nav-back {
  position: absolute; top: 16px; left: 16px;
  color: #e2d4f5; text-decoration: none; font-size: 14px; font-weight: 700;
  display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,.1);
  padding: 8px 14px; border-radius: 20px;
}

.card {
  width: 100%; max-width: 480px;
  background: #fff; color: #2b2d42;
  border-radius: 24px; padding: 26px 22px;
  box-shadow: 0 12px 40px rgba(0,0,0,.3);
  text-align: center;
}

h1 { font-size: 26px; font-weight: 900; color: #3b2054; margin-bottom: 4px; }
.sub { font-size: 14px; color: #666; margin-bottom: 18px; font-weight: 600; }

/* Preset buttons */
.time-presets {
  display: flex; justify-content: center; gap: 8px; margin-bottom: 20px;
}
.preset-btn {
  font: inherit; font-size: 13px; font-weight: 800; border: 0; border-radius: 20px;
  padding: 7px 16px; cursor: pointer; background: #f3eafd; color: #6a349c; transition: .15s;
}
.preset-btn.on { background: #8d4fc9; color: #fff; }

/* Big Timer Circle */
.timer-circle {
  width: 170px; height: 170px; border-radius: 50%;
  border: 8px solid #ecd8ff; margin: 0 auto 20px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: radial-gradient(circle, #fff, #faf6ff);
  box-shadow: 0 4px 16px rgba(141,79,201,.15);
  transition: border-color .3s;
}
.timer-circle.running { border-color: #8d4fc9; }
.time-display { font-size: 44px; font-weight: 900; color: #3b2054; letter-spacing: 1px; }

/* Controls */
.controls { display: flex; justify-content: center; gap: 12px; margin-bottom: 22px; }
.ctrl-btn {
  font: inherit; font-size: 16px; font-weight: 800; border: 0; border-radius: 24px;
  padding: 11px 26px; cursor: pointer; transition: all .15s ease;
}
.btn-start { background: #8d4fc9; color: #fff; }
.btn-pause { background: #f59e0b; color: #fff; }
.btn-reset { background: #e2e8f0; color: #475569; }

/* Log form */
.log-box {
  background: #fdfaf7; border: 1px solid #fae8d4; border-radius: 16px;
  padding: 14px 16px; text-align: left; font-size: 13px;
}
.log-box h3 { font-size: 14px; font-weight: 900; color: #c05621; margin-bottom: 8px; }
.form-row { display: flex; gap: 8px; margin-bottom: 8px; }
input[type="text"] {
  flex: 1; border: 1px solid #cbd5e1; border-radius: 8px; padding: 7px 10px; font: inherit; font-size: 13px;
}
.save-log-btn {
  width: 100%; border: 0; background: #e07a22; color: #fff; font: inherit; font-weight: 800;
  padding: 8px; border-radius: 10px; cursor: pointer; margin-top: 4px;
}
.history-list {
  margin-top: 10px; max-height: 100px; overflow-y: auto; font-size: 12px; color: #64748b;
}
.history-item { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px dashed #f1f5f9; }
</style>
</head>
<body>

<a href="index.html" class="nav-back">← Zurück zum Portal</a>

<div class="card">
  <h1>📖 Lese-Timer</h1>
  <div class="sub">Täglich 10 Minuten lesen &amp; Belohnungssterne sammeln!</div>

  <div class="time-presets">
    <button class="preset-btn" data-time="300">5 Min.</button>
    <button class="preset-btn on" data-time="600">10 Min.</button>
    <button class="preset-btn" data-time="900">15 Min.</button>
  </div>

  <div class="timer-circle" id="timer-box">
    <div class="time-display" id="time-display">10:00</div>
  </div>

  <div class="controls">
    <button class="ctrl-btn btn-start" id="btn-toggle">▶ Start</button>
    <button class="ctrl-btn btn-reset" id="btn-reset">↺ Reset</button>
  </div>

  <div class="log-box">
    <h3>📝 Heute im Lesetagebuch festhalten</h3>
    <div class="form-row">
      <input type="text" id="book-title" placeholder="Buchtitel (z. B. Die drei ???)">
      <input type="text" id="book-pages" placeholder="Seiten (z. B. 12-24)" style="max-width: 110px;">
    </div>
    <button class="save-log-btn" id="btn-save-log">Eintrag speichern ⭐</button>
    <div class="history-list" id="history-container"></div>
  </div>
</div>

<script>
let totalSeconds = 600;
let remaining = 600;
let timerId = null;

const display = document.getElementById("time-display");
const btnToggle = document.getElementById("btn-toggle");
const btnReset = document.getElementById("btn-reset");
const timerBox = document.getElementById("timer-box");

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${m}:${s < 10 ? '0' : ''}${s}`;
}

function updateDisplay() {
  display.innerText = formatTime(remaining);
}

document.querySelectorAll(".preset-btn").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".preset-btn").forEach(b => b.classList.remove("on"));
    btn.classList.add("on");
    totalSeconds = +btn.dataset.time;
    resetTimer();
  };
});

function toggleTimer() {
  if (timerId) {
    clearInterval(timerId);
    timerId = null;
    btnToggle.innerText = "▶ Weiter";
    btnToggle.className = "ctrl-btn btn-start";
    timerBox.classList.remove("running");
  } else {
    timerBox.classList.add("running");
    btnToggle.innerText = "⏸ Pause";
    btnToggle.className = "ctrl-btn btn-pause";
    timerId = setInterval(() => {
      remaining--;
      updateDisplay();
      if (remaining <= 0) {
        clearInterval(timerId);
        timerId = null;
        timerBox.classList.remove("running");
        btnToggle.innerText = "🎉 Fertig!";
        playChime();
        alert("🎉 Bravo! 10 Minuten Lesezeit geschafft! Trag dein Buch unten ein ⭐");
      }
    }, 1000);
  }
}

function resetTimer() {
  if (timerId) clearInterval(timerId);
  timerId = null;
  remaining = totalSeconds;
  timerBox.classList.remove("running");
  btnToggle.innerText = "▶ Start";
  btnToggle.className = "ctrl-btn btn-start";
  updateDisplay();
}

btnToggle.onclick = toggleTimer;
btnReset.onclick = resetTimer;

// Audio Chime
function playChime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
    osc.frequency.exponentialRampToValueAtTime(659.25, ctx.currentTime + 0.3); // E5
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 1.2);
  } catch(e){}
}

// Log storage
const LOG_KEY = "lese-tagebuch-entries-v1";
let logs = JSON.parse(localStorage.getItem(LOG_KEY) || "[]");

function renderLogs() {
  const container = document.getElementById("history-container");
  if (logs.length === 0) {
    container.innerHTML = "<em>Noch keine Leseeinträge vorhanden.</em>";
    return;
  }
  container.innerHTML = logs.slice(-5).reverse().map(l =>
    `<div class="history-item"><span>📖 ${l.title} (${l.pages})</span><span>${l.date}</span></div>`
  ).join("");
}

document.getElementById("btn-save-log").onclick = () => {
  const title = document.getElementById("book-title").value.trim();
  const pages = document.getElementById("book-pages").value.trim();
  if (!title) { alert("Bitte einen Buchtitel eingeben!"); return; }
  logs.push({
    title,
    pages: pages || "Kapitel",
    date: new Date().toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" })
  });
  localStorage.setItem(LOG_KEY, JSON.stringify(logs));
  document.getElementById("book-title").value = "";
  document.getElementById("book-pages").value = "";
  renderLogs();
};

renderLogs();
updateDisplay();
</script>
</body>
</html>
