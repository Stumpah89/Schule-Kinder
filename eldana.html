<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Eldanas Lern-App 🐰</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eldanas App">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐰</text></svg>">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐰</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Nunito', system-ui, -apple-system, sans-serif;
  color: #1e293b;
  background: #fff8f5;
  min-height: 100vh;
  padding-bottom: 50px;
  -webkit-tap-highlight-color: transparent;
}

header {
  background: linear-gradient(135deg, #ea580c, #fb923c);
  color: #fff;
  padding: 24px 20px 32px;
  border-bottom-left-radius: 28px;
  border-bottom-right-radius: 28px;
  box-shadow: 0 6px 20px rgba(234,88,12,.2);
  text-align: center;
  position: relative;
}
.home-link {
  position: absolute; top: 16px; left: 16px; color: #ffedd5;
  text-decoration: none; font-size: 13px; font-weight: 800;
  background: rgba(0,0,0,.15); padding: 6px 12px; border-radius: 20px;
}
.avatar-large {
  width: 72px; height: 72px; border-radius: 50%;
  background: rgba(255,255,255,.25); font-size: 42px;
  margin: 0 auto 10px; display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 12px rgba(0,0,0,.15);
}
header h1 { font-size: 28px; font-weight: 900; letter-spacing: -0.5px; }
.week-info {
  margin-top: 6px; font-size: 15px; font-weight: 700; color: #ffedd5;
  display: inline-block; background: rgba(0,0,0,.15); padding: 4px 14px; border-radius: 20px;
}

.main-content {
  max-width: 700px;
  margin: -16px auto 0;
  padding: 0 16px;
}

/* Quick Tools */
.quick-tools {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 22px;
}
.tool-tile {
  background: #fff; border-radius: 18px; padding: 16px 14px;
  text-decoration: none; color: inherit; display: flex; align-items: center; gap: 12px;
  box-shadow: 0 4px 14px rgba(0,0,0,.04); border: 2px solid #fed7aa;
  transition: transform .12s;
}
.tool-tile:active { transform: scale(0.97); }
.tool-icon { font-size: 32px; flex: none; }
.tool-tile b { font-size: 16px; font-weight: 900; display: block; color: #c2410c; }
.tool-tile span { font-size: 12px; color: #64748b; font-weight: 600; }

.reset-bar {
  background: #fff; border-radius: 16px; padding: 12px 18px; margin-bottom: 20px;
  display: flex; justify-content: space-between; align-items: center;
  box-shadow: 0 2px 8px rgba(0,0,0,.04); border: 1px solid #ffedd5;
}
.reset-btn {
  border: 0; background: #fff7ed; color: #c2410c; font: inherit; font-size: 13px;
  font-weight: 800; padding: 7px 14px; border-radius: 20px; cursor: pointer;
}

/* Today Card */
.today-card {
  background: #fff; border-radius: 22px; padding: 20px 22px;
  box-shadow: 0 6px 20px rgba(0,0,0,.06); border: 3px solid #f97316;
  margin-bottom: 24px; position: relative;
}
.today-badge {
  background: #f97316; color: #fff; font-size: 12px; font-weight: 900;
  padding: 4px 12px; border-radius: 20px; display: inline-block;
  text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px;
}
.today-title { font-size: 22px; font-weight: 900; color: #1e293b; margin-bottom: 14px; }

/* Big readable tasks */
.tasks-list { display: flex; flex-direction: column; gap: 10px; }
.task-row {
  display: flex; align-items: center; gap: 14px; padding: 14px 16px;
  background: #fdfaf8; border: 2px solid #fed7aa; border-radius: 16px;
  cursor: pointer; transition: all .15s ease; user-select: none;
}
.task-row:active { transform: scale(0.98); }
.task-row.done {
  background: #fff7ed; border-color: #fdba74; text-decoration: line-through; opacity: .7;
}
.big-chk {
  width: 32px; height: 32px; border-radius: 10px; border: 3px solid #cbd5e1;
  display: flex; align-items: center; justify-content: center; font-size: 20px;
  font-weight: 900; color: #ea580c; background: #fff; flex: none;
}
.task-row.done .big-chk {
  border-color: #ea580c; background: #ea580c; color: #fff;
}
.task-info { flex: 1; }
.task-time { font-size: 13px; font-weight: 800; color: #ea580c; margin-bottom: 2px; }
.task-text { font-size: 17px; font-weight: 800; color: #1e293b; line-height: 1.35; }

/* Day Navigator */
.days-nav {
  display: flex; gap: 6px; overflow-x: auto; padding: 6px 2px 14px; margin-bottom: 14px;
}
.day-tab {
  font: inherit; font-size: 14px; font-weight: 800; border: 0; border-radius: 20px;
  padding: 8px 16px; cursor: pointer; background: #fff; color: #475569;
  box-shadow: 0 2px 6px rgba(0,0,0,.04); flex: none; border: 1px solid #fed7aa;
}
.day-tab.on { background: #ea580c; color: #fff; border-color: #ea580c; }

/* Star Reward section */
.star-box {
  background: linear-gradient(135deg, #fffbeb, #fef3c7);
  border: 2px dashed #f59e0b; border-radius: 20px; padding: 18px 20px;
  display: flex; align-items: center; justify-content: space-between; margin-top: 18px;
}
.star-btn-big {
  font-size: 38px; cursor: pointer; filter: grayscale(1); opacity: .35;
  transition: all .2s; border: 0; background: transparent;
}
.star-btn-big.earned { filter: none; opacity: 1; transform: scale(1.15); }
</style>
</head>
<body>

<header>
  <a href="index.html" class="home-link">← Alle Kinder</a>
  <div class="avatar-large">🐰</div>
  <h1>Hallo Eldana!</h1>
  <div class="week-info" id="week-display">Woche lädt…</div>
</header>

<div class="main-content">

  <div class="quick-tools">
    <a href="Lese-Timer.html" class="tool-tile">
      <div class="tool-icon">📖</div>
      <div>
        <b>Lese-Timer</b>
        <span>10 Min. laut lesen</span>
      </div>
    </a>
    <a href="1x1-Trainer.html" class="tool-tile">
      <div class="tool-icon">⚡</div>
      <div>
        <b>Rechen-Blitz</b>
        <span>Plus &amp; Minus bis 100</span>
      </div>
    </a>
    <a href="Ranzen-Packliste.html" class="tool-tile">
      <div class="tool-icon">🎒</div>
      <div>
        <b>Ranzen-Check</b>
        <span>Mäppchen &amp; Tasche</span>
      </div>
    </a>
    <a href="Belohnungs-Pass-Editor.html" class="tool-tile">
      <div class="tool-icon">⭐</div>
      <div>
        <b>Belohnungs-Pass</b>
        <span>Ausflug &amp; Tierpark</span>
      </div>
    </a>
  </div>

  <div class="reset-bar">
    <span style="font-size:14px;font-weight:800;color:#c2410c">📅 Deine Aufgaben dieser Woche:</span>
    <button class="reset-btn" id="btn-new-week" title="Startet bei 0 für eine neue Woche">🔄 Neue Woche bei 0</button>
  </div>

  <div class="days-nav" id="days-nav"></div>

  <div class="today-card">
    <div class="today-badge" id="selected-day-badge">Heute</div>
    <div class="today-title" id="selected-day-title">Montag</div>

    <div class="tasks-list" id="tasks-container"></div>

    <div class="star-box">
      <div>
        <b style="font-size:16px;color:#92400e;display:block">Tagesziel geschafft?</b>
        <span style="font-size:13px;color:#b45309">Klick auf den Stern für deinen Belohnungspass!</span>
      </div>
      <button class="star-btn-big" id="star-btn">⭐</button>
    </div>
  </div>

</div>

<script>
const DAYS_DATA = [
  {
    name: "Montag", icon: "📖",
    tasks: [
      { time: "17:00", text: "Ankommen, Snack & kurze Pause 🍎" },
      { time: "17:15 – 17:40", text: "Hausaufgaben erledigen" },
      { time: "17:45 – 18:05", text: "10 Min. laut vorlesen + 10 Min. Schreiben üben" }
    ]
  },
  {
    name: "Dienstag", icon: "🥋",
    tasks: [
      { time: "17:00", text: "Ankommen & Snack 🍎" },
      { time: "17:10 – 17:40", text: "Hausaufgaben + 10 Min. Plus/Minus bis 100" },
      { time: "18:00 – 19:30", text: "Taekwondo 🥋 (Puffer für Fahrt & Umziehen)" }
    ]
  },
  {
    name: "Mittwoch", icon: "📖",
    tasks: [
      { time: "17:00", text: "Ankommen, Snack & Pause 🍎" },
      { time: "17:15 – 17:40", text: "Hausaufgaben erledigen" },
      { time: "17:45 – 18:05", text: "Rechnen bis 100 + 10 Min. laut vorlesen" }
    ]
  },
  {
    name: "Donnerstag", icon: "🥋",
    tasks: [
      { time: "17:00", text: "Ankommen & Snack 🍎" },
      { time: "17:10 – 17:40", text: "Hausaufgaben + 10 Min. Wörter abschreiben" },
      { time: "18:00 – 19:30", text: "Taekwondo 🥋" }
    ]
  },
  {
    name: "Freitag", icon: "🇬🇧",
    tasks: [
      { time: "17:00", text: "Ankommen & Snack 🍎" },
      { time: "17:10 – 17:40", text: "Lesen + kleines Rechenspiel / Anton App" },
      { time: "18:00 – 19:30", text: "Englischkurs 🇬🇧" }
    ]
  },
  {
    name: "Samstag", icon: "🇬🇧",
    tasks: [
      { time: "10:00 – 10:40", text: "Übungsblatt von Andreas (Schreiben + Mathe) + Vorlesen" },
      { time: "18:00 – 19:30", text: "Englischkurs 🇬🇧" }
    ]
  },
  {
    name: "Sonntag", icon: "☀️",
    tasks: [
      { time: "15 Min.", text: "Gemeinsam vorlesen mit Mama & Ranzen packen 🎒" }
    ]
  }
];

function getKW() {
  const d = new Date();
  const date = new Date(d.getTime());
  date.setHours(0, 0, 0, 0);
  date.setDate(date.getDate() + 3 - (date.getDay() + 6) % 7);
  const week1 = new Date(date.getFullYear(), 0, 4);
  return 1 + Math.round(((date.getTime() - week1.getTime()) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
}

const currentKW = getKW();
const STORAGE_PREFIX = `eldana_plan_kw${currentKW}_`;

document.getElementById("week-display").innerText = `Kalenderwoche ${currentKW} · 2. Klasse`;

let currentDayIndex = new Date().getDay();
let activeDay = currentDayIndex === 0 ? 6 : currentDayIndex - 1;

function renderNav() {
  const nav = document.getElementById("days-nav");
  nav.innerHTML = DAYS_DATA.map((d, i) =>
    `<button class="day-tab ${i === activeDay ? 'on' : ''}" onclick="selectDay(${i})">${d.icon} ${d.name}</button>`
  ).join("");
}

function selectDay(i) {
  activeDay = i;
  renderNav();
  renderDay();
}

function renderDay() {
  const day = DAYS_DATA[activeDay];
  document.getElementById("selected-day-badge").innerText = (activeDay === (currentDayIndex === 0 ? 6 : currentDayIndex - 1)) ? "HEUTE AKTIV ⭐" : "WOCHENTAG";
  document.getElementById("selected-day-title").innerText = `${day.icon} ${day.name}`;

  const container = document.getElementById("tasks-container");
  container.innerHTML = day.tasks.map((t, idx) => {
    const key = `${STORAGE_PREFIX}day${activeDay}_task${idx}`;
    const isDone = localStorage.getItem(key) === "true";
    return `
      <div class="task-row ${isDone ? 'done' : ''}" onclick="toggleTask(${activeDay}, ${idx})">
        <div class="big-chk">${isDone ? '✓' : ''}</div>
        <div class="task-info">
          <div class="task-time">${t.time}</div>
          <div class="task-text">${t.text}</div>
        </div>
      </div>
    `;
  }).join("");

  const starKey = `${STORAGE_PREFIX}day${activeDay}_star`;
  const starEarned = localStorage.getItem(starKey) === "true";
  const starBtn = document.getElementById("star-btn");
  starBtn.className = `star-btn-big ${starEarned ? 'earned' : ''}`;
  starBtn.onclick = () => {
    const nextState = !starEarned;
    localStorage.setItem(starKey, nextState);
    renderDay();
  };
}

function toggleTask(d, i) {
  const key = `${STORAGE_PREFIX}day${d}_task${i}`;
  const cur = localStorage.getItem(key) === "true";
  localStorage.setItem(key, !cur);
  renderDay();
}

document.getElementById("btn-new-week").onclick = () => {
  if (confirm("Möchtest du alle Haken und Sterne für diese Woche auf 0 zurücksetzen?")) {
    Object.keys(localStorage).forEach(k => {
      if (k.startsWith(STORAGE_PREFIX)) localStorage.removeItem(k);
    });
    renderDay();
  }
};

renderNav();
renderDay();
</script>
</body>
</html>
